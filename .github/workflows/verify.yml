name: Verify

on:
  pull_request:
  push:
    # Only main: PR branches are covered by the pull_request trigger above
    # (avoids a redundant second full-gate run per PR commit).
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Nightly safety net for verification drift.
    - cron: '17 9 * * *'

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verification:
    name: Verify full gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        # 2026-06-19: keep byte-equal with verify-phase-6/7/8.yml; this pins the postgres:16 verifier DB manifest.
        image: postgres:16@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
        env:
          POSTGRES_USER: policy_pilot
          POSTGRES_PASSWORD: policy_pilot
          POSTGRES_DB: policypilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policy_pilot -d policypilot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Write full verification CI environment
        shell: bash
        run: |
          set -euo pipefail

          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY=ci-service-role-placeholder
          DATABASE_URL=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci
          DIRECT_URL=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci
          DATABASE_URL_TEST=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci_test
          DIRECT_URL_TEST=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci_test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2xlcmsuaW5zcGlyZWQucHVtYS03NC5sY2wuZGV2JA
          CLERK_SECRET_KEY=sk_test_policy_pilot_ci_dummy
          CLERK_WEBHOOK_SECRET=whsec_policy_pilot_ci_dummy
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/post-sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/post-sign-in
          POLICYPILOT_E2E_AUTH_BYPASS=1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_policy_pilot_ci_dummy
          STRIPE_SECRET_KEY=sk_test_policy_pilot_ci_dummy
          STRIPE_WEBHOOK_SECRET=whsec_policy_pilot_ci_dummy
          STRIPE_PRICE_STARTER_MONTHLY=price_starter_monthly_ci
          STRIPE_PRICE_STARTER_ANNUAL=price_starter_annual_ci
          STRIPE_PRICE_GROWTH_MONTHLY=price_growth_monthly_ci
          STRIPE_PRICE_GROWTH_ANNUAL=price_growth_annual_ci
          STRIPE_PRICE_BUSINESS_MONTHLY=price_business_monthly_ci
          STRIPE_PRICE_BUSINESS_ANNUAL=price_business_annual_ci
          ANTHROPIC_API_KEY=sk-ant-ci-placeholder
          RESEND_API_KEY=re_ci_placeholder
          RESEND_FROM_EMAIL=noreply@policypilot.com
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          CRON_SECRET=cron_ci_placeholder
          NEXT_PUBLIC_POSTHOG_KEY=phc_ci_placeholder
          NEXT_PUBLIC_POSTHOG_HOST=https://app.posthog.com
          SENTRY_DSN=
          EOF

          sed -i 's/^          //' .env.local
          cp .env.local .env.local.test
          sed -i \
            -e 's#^DATABASE_URL=.*#DATABASE_URL=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci_test#' \
            -e 's#^DIRECT_URL=.*#DIRECT_URL=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci_test#' \
            .env.local.test

      - name: Prepare CI databases
        shell: bash
        run: |
          set -euo pipefail

          install_supabase_stubs() {
            local db="$1"
            PGPASSWORD=policy_pilot psql -h 127.0.0.1 -U policy_pilot -d "$db" <<'SQL'
          DO $$
          BEGIN
            CREATE ROLE authenticated;
          EXCEPTION WHEN duplicate_object THEN
            NULL;
          END
          $$;

          CREATE SCHEMA IF NOT EXISTS auth;

          CREATE OR REPLACE FUNCTION auth.jwt()
          RETURNS jsonb
          LANGUAGE sql
          STABLE
          AS $$
            SELECT COALESCE(NULLIF(current_setting('request.jwt.claims', true), ''), '{}')::jsonb;
          $$;
          SQL
          }

          PGPASSWORD=policy_pilot psql -h 127.0.0.1 -U policy_pilot -d policypilot_ci -tc "SELECT 1 FROM pg_database WHERE datname = 'policypilot_ci_test'" | grep -q 1 || \
            PGPASSWORD=policy_pilot createdb -h 127.0.0.1 -U policy_pilot policypilot_ci_test
          install_supabase_stubs policypilot_ci
          install_supabase_stubs policypilot_ci_test
          pnpm db:migrate
          pnpm db:migrate:test

      - name: Run full verification sweep
        run: pnpm verify:full

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-verification-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser-smoke:
    name: Browser e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Write Playwright CI environment
        shell: bash
        run: |
          set -euo pipefail

          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-placeholder
          SUPABASE_SERVICE_ROLE_KEY=ci-service-role-placeholder
          DATABASE_URL=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci
          DIRECT_URL=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci
          DATABASE_URL_TEST=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci_test
          DIRECT_URL_TEST=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci_test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2xlcmsuaW5zcGlyZWQucHVtYS03NC5sY2wuZGV2JA
          CLERK_SECRET_KEY=sk_test_policy_pilot_ci_dummy
          CLERK_WEBHOOK_SECRET=whsec_policy_pilot_ci_dummy
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/post-sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/post-sign-in
          POLICYPILOT_E2E_AUTH_BYPASS=1
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_policy_pilot_ci_dummy
          STRIPE_SECRET_KEY=sk_test_policy_pilot_ci_dummy
          STRIPE_WEBHOOK_SECRET=whsec_policy_pilot_ci_dummy
          STRIPE_PRICE_STARTER_MONTHLY=price_starter_monthly_ci
          STRIPE_PRICE_STARTER_ANNUAL=price_starter_annual_ci
          STRIPE_PRICE_GROWTH_MONTHLY=price_growth_monthly_ci
          STRIPE_PRICE_GROWTH_ANNUAL=price_growth_annual_ci
          STRIPE_PRICE_BUSINESS_MONTHLY=price_business_monthly_ci
          STRIPE_PRICE_BUSINESS_ANNUAL=price_business_annual_ci
          ANTHROPIC_API_KEY=sk-ant-ci-placeholder
          RESEND_API_KEY=re_ci_placeholder
          RESEND_FROM_EMAIL=noreply@policypilot.com
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          CRON_SECRET=cron_ci_placeholder
          NEXT_PUBLIC_POSTHOG_KEY=phc_ci_placeholder
          NEXT_PUBLIC_POSTHOG_HOST=https://app.posthog.com
          SENTRY_DSN=
          EOF

          sed -i 's/^          //' .env.local
          cp .env.local .env.local.test
          sed -i \
            -e 's#^DATABASE_URL=.*#DATABASE_URL=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci_test#' \
            -e 's#^DIRECT_URL=.*#DIRECT_URL=postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci_test#' \
            .env.local.test

      - name: Run Playwright e2e suite
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  live-verification:
    name: Live full verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: read
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      DIRECT_URL_TEST: ${{ secrets.DIRECT_URL_TEST }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_STARTER_MONTHLY: ${{ secrets.STRIPE_PRICE_STARTER_MONTHLY }}
      STRIPE_PRICE_STARTER_ANNUAL: ${{ secrets.STRIPE_PRICE_STARTER_ANNUAL }}
      STRIPE_PRICE_GROWTH_MONTHLY: ${{ secrets.STRIPE_PRICE_GROWTH_MONTHLY }}
      STRIPE_PRICE_GROWTH_ANNUAL: ${{ secrets.STRIPE_PRICE_GROWTH_ANNUAL }}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${{ secrets.STRIPE_PRICE_BUSINESS_MONTHLY }}
      STRIPE_PRICE_BUSINESS_ANNUAL: ${{ secrets.STRIPE_PRICE_BUSINESS_ANNUAL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Check live verification secrets
        id: live-secrets
        shell: bash
        run: |
          set -euo pipefail

          required=(
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            DATABASE_URL
            DIRECT_URL
            DATABASE_URL_TEST
            DIRECT_URL_TEST
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
            CLERK_WEBHOOK_SECRET
            ANTHROPIC_API_KEY
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              printf '::error::Cannot run manual live full verification; missing repository secrets: %s\n' "${missing[*]}"
              exit 1
            fi
            printf '::notice::Skipping scheduled live full verification; missing repository secrets: %s\n' "${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.live-secrets.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: steps.live-secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9
        with:
          version: 9.15.9

      - name: Setup Node.js
        if: steps.live-secrets.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.live-secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.live-secrets.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps

      - name: Write live CI environment files
        if: steps.live-secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          write_env_file() {
            local file="$1"
            local database_url="$2"
            local direct_url="$3"
            local sign_in="${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/post-sign-in}"
            local sign_up="${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/post-sign-in}"
            local app_url="${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
            local resend_from="${RESEND_FROM_EMAIL:-noreply@policypilot.com}"
            local posthog_host="${NEXT_PUBLIC_POSTHOG_HOST:-https://app.posthog.com}"

            {
              printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
              printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
              printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
              printf 'DATABASE_URL=%s\n' "$database_url"
              printf 'DIRECT_URL=%s\n' "$direct_url"
              printf 'DATABASE_URL_TEST=%s\n' "$DATABASE_URL_TEST"
              printf 'DIRECT_URL_TEST=%s\n' "$DIRECT_URL_TEST"
              printf 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=%s\n' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
              printf 'CLERK_SECRET_KEY=%s\n' "$CLERK_SECRET_KEY"
              printf 'CLERK_WEBHOOK_SECRET=%s\n' "$CLERK_WEBHOOK_SECRET"
              printf 'NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=%s\n' "$sign_in"
              printf 'NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=%s\n' "$sign_up"
              printf 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=%s\n' "${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}"
              printf 'STRIPE_SECRET_KEY=%s\n' "${STRIPE_SECRET_KEY:-sk_test_placeholder}"
              printf 'STRIPE_WEBHOOK_SECRET=%s\n' "${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}"
              printf 'STRIPE_PRICE_STARTER_MONTHLY=%s\n' "${STRIPE_PRICE_STARTER_MONTHLY:-price_starter_monthly_placeholder}"
              printf 'STRIPE_PRICE_STARTER_ANNUAL=%s\n' "${STRIPE_PRICE_STARTER_ANNUAL:-price_starter_annual_placeholder}"
              printf 'STRIPE_PRICE_GROWTH_MONTHLY=%s\n' "${STRIPE_PRICE_GROWTH_MONTHLY:-price_growth_monthly_placeholder}"
              printf 'STRIPE_PRICE_GROWTH_ANNUAL=%s\n' "${STRIPE_PRICE_GROWTH_ANNUAL:-price_growth_annual_placeholder}"
              printf 'STRIPE_PRICE_BUSINESS_MONTHLY=%s\n' "${STRIPE_PRICE_BUSINESS_MONTHLY:-price_business_monthly_placeholder}"
              printf 'STRIPE_PRICE_BUSINESS_ANNUAL=%s\n' "${STRIPE_PRICE_BUSINESS_ANNUAL:-price_business_annual_placeholder}"
              printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"
              printf 'RESEND_API_KEY=%s\n' "${RESEND_API_KEY:-re_placeholder}"
              printf 'RESEND_FROM_EMAIL=%s\n' "$resend_from"
              printf 'NEXT_PUBLIC_APP_URL=%s\n' "$app_url"
              printf 'CRON_SECRET=%s\n' "${CRON_SECRET:-cron_placeholder}"
              printf 'NEXT_PUBLIC_POSTHOG_KEY=%s\n' "${NEXT_PUBLIC_POSTHOG_KEY:-phc_placeholder}"
              printf 'NEXT_PUBLIC_POSTHOG_HOST=%s\n' "$posthog_host"
              printf 'SENTRY_DSN=%s\n' "${SENTRY_DSN:-}"
            } > "$file"
          }

          write_env_file .env.local "$DATABASE_URL" "$DIRECT_URL"
          write_env_file .env.local.test "$DATABASE_URL_TEST" "$DIRECT_URL_TEST"

      - name: Run full verification sweep
        if: steps.live-secrets.outputs.ready == 'true'
        run: pnpm verify:full

      - name: Upload Playwright report on failure
        if: failure() && steps.live-secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
