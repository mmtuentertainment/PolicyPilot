name: Verify Phase 7

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-phase-7-${{ github.ref }}
  cancel-in-progress: true

# Each per-phase verifier runs against its OWN ephemeral postgres:16 service
# container instead of the shared remote Supabase verification DB, so the
# Phase 6/7/8 verifiers can run concurrently without TRUNCATE-CASCADE deadlocks
# / RLS positive-control races. App secrets are still referenced by name from
# the repo secret store (never hardcoded); only the database is local.
jobs:
  phase-7-verification:
    name: Phase 7 verifier
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: policy_pilot
          POSTGRES_PASSWORD: policy_pilot
          POSTGRES_DB: policypilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policy_pilot -d policypilot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_STARTER_MONTHLY: ${{ secrets.STRIPE_PRICE_STARTER_MONTHLY }}
      STRIPE_PRICE_STARTER_ANNUAL: ${{ secrets.STRIPE_PRICE_STARTER_ANNUAL }}
      STRIPE_PRICE_GROWTH_MONTHLY: ${{ secrets.STRIPE_PRICE_GROWTH_MONTHLY }}
      STRIPE_PRICE_GROWTH_ANNUAL: ${{ secrets.STRIPE_PRICE_GROWTH_ANNUAL }}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${{ secrets.STRIPE_PRICE_BUSINESS_MONTHLY }}
      STRIPE_PRICE_BUSINESS_ANNUAL: ${{ secrets.STRIPE_PRICE_BUSINESS_ANNUAL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Write verification environment
        shell: bash
        run: |
          set -euo pipefail

          required=(
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
            CLERK_WEBHOOK_SECRET
            ANTHROPIC_API_KEY
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
            STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET
            STRIPE_PRICE_STARTER_MONTHLY
            STRIPE_PRICE_STARTER_ANNUAL
            STRIPE_PRICE_GROWTH_MONTHLY
            STRIPE_PRICE_GROWTH_ANNUAL
            STRIPE_PRICE_BUSINESS_MONTHLY
            STRIPE_PRICE_BUSINESS_ANNUAL
          )

          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Cannot run Phase 6 verification; missing repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          # The database is a LOCAL ephemeral postgres:16 service container (see
          # services.postgres above), NOT the shared remote Supabase DB. This is
          # what removes the cross-workflow TRUNCATE-CASCADE contention flake.
          ci_db_main="postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci"
          ci_db_test="postgresql://policy_pilot:policy_pilot@127.0.0.1:5432/policypilot_ci_test"

          write_env_file() {
            local file="$1"
            local database_url="$2"
            local direct_url="$3"
            {
              printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
              printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
              printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
              printf 'DATABASE_URL=%s\n' "$database_url"
              printf 'DIRECT_URL=%s\n' "$direct_url"
              printf 'DATABASE_URL_TEST=%s\n' "$ci_db_test"
              printf 'DIRECT_URL_TEST=%s\n' "$ci_db_test"
              printf 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=%s\n' "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
              printf 'CLERK_SECRET_KEY=%s\n' "$CLERK_SECRET_KEY"
              printf 'CLERK_WEBHOOK_SECRET=%s\n' "$CLERK_WEBHOOK_SECRET"
              printf 'NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/post-sign-in\n'
              printf 'NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/post-sign-in\n'
              printf 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=%s\n' "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
              printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
              printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET"
              printf 'STRIPE_PRICE_STARTER_MONTHLY=%s\n' "$STRIPE_PRICE_STARTER_MONTHLY"
              printf 'STRIPE_PRICE_STARTER_ANNUAL=%s\n' "$STRIPE_PRICE_STARTER_ANNUAL"
              printf 'STRIPE_PRICE_GROWTH_MONTHLY=%s\n' "$STRIPE_PRICE_GROWTH_MONTHLY"
              printf 'STRIPE_PRICE_GROWTH_ANNUAL=%s\n' "$STRIPE_PRICE_GROWTH_ANNUAL"
              printf 'STRIPE_PRICE_BUSINESS_MONTHLY=%s\n' "$STRIPE_PRICE_BUSINESS_MONTHLY"
              printf 'STRIPE_PRICE_BUSINESS_ANNUAL=%s\n' "$STRIPE_PRICE_BUSINESS_ANNUAL"
              printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"
              printf 'RESEND_API_KEY=%s\n' "${RESEND_API_KEY:-}"
              printf 'RESEND_FROM_EMAIL=%s\n' "${RESEND_FROM_EMAIL:-noreply@policypilot.com}"
              printf 'NEXT_PUBLIC_APP_URL=http://localhost:3000\n'
              printf 'CRON_SECRET=%s\n' "${CRON_SECRET:-}"
              printf 'NEXT_PUBLIC_POSTHOG_KEY=%s\n' "${NEXT_PUBLIC_POSTHOG_KEY:-}"
              printf 'NEXT_PUBLIC_POSTHOG_HOST=%s\n' "${NEXT_PUBLIC_POSTHOG_HOST:-https://app.posthog.com}"
              printf 'SENTRY_DSN=%s\n' "${SENTRY_DSN:-}"
            } > "$file"
          }

          write_env_file .env.local "$ci_db_main" "$ci_db_main"
          write_env_file .env.local.test "$ci_db_test" "$ci_db_test"

      - name: Prepare CI databases
        shell: bash
        run: |
          set -euo pipefail

          install_supabase_stubs() {
            local db="$1"
            PGPASSWORD=policy_pilot psql -h 127.0.0.1 -U policy_pilot -d "$db" <<'SQL'
          DO $$
          BEGIN
            CREATE ROLE authenticated;
          EXCEPTION WHEN duplicate_object THEN
            NULL;
          END
          $$;

          CREATE SCHEMA IF NOT EXISTS auth;

          CREATE OR REPLACE FUNCTION auth.jwt()
          RETURNS jsonb
          LANGUAGE sql
          STABLE
          AS $$
            SELECT COALESCE(NULLIF(current_setting('request.jwt.claims', true), ''), '{}')::jsonb;
          $$;
          SQL
          }

          PGPASSWORD=policy_pilot psql -h 127.0.0.1 -U policy_pilot -d policypilot_ci -tc "SELECT 1 FROM pg_database WHERE datname = 'policypilot_ci_test'" | grep -q 1 || \
            PGPASSWORD=policy_pilot createdb -h 127.0.0.1 -U policy_pilot policypilot_ci_test
          install_supabase_stubs policypilot_ci
          install_supabase_stubs policypilot_ci_test
          pnpm db:migrate
          pnpm db:migrate:test

      - name: Run Phase 7 verifier
        run: pnpm verify:phase-7
